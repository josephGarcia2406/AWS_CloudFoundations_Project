spring.application.name=AWSProject
server.port=80

# Configuración de base de datos MySQL (con soporte para variables de entorno)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:awsproject}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Propiedades de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# AWS General Configuration
aws.region=us-east-1

# AWS S3 Configuration
aws.s3.bucket-name=awsproject-fotos-2026

# AWS SNS Configuration
aws.sns.topic-arn=arn:aws:sns:us-east-1:203048719550:calificaciones-topic

# AWS DynamoDB Configuration
aws.dynamodb.table-name=${AWS_DYNAMODB_TABLE_NAME:sesiones-alumnos}